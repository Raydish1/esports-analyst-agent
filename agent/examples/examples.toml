'''

[[example]]
id = "ex30"
shape = "ranking"
question = "Who has made the most top 8s at Worlds?"
note = "'Worlds' is a series: filter it on v_event_series, then count per player in SQL and rank, a few rows past the cutoff so ties show."
call = 'rank_players(by="top8s", event="worlds")'
call_note = "A series name narrows the ranking, and its regional championships (worlds 2020 and 2021) are counted in a column of their own."
sql = '''
SELECT p.name, COUNT(*) AS top8s
FROM v_results r JOIN players p ON p.player_id = r.player_id
WHERE r.placement <= 8 AND r.event_id IN (SELECT event_id FROM v_event_series WHERE series = 'worlds')
GROUP BY r.player_id
ORDER BY top8s DESC
LIMIT 5
'''

[[example]]
id = "ex31"
shape = "stats"
question = "what are Remmy's stats"
note = "A player's stats are their whole record: count every result by mode in SQL, wins, medals and top 8s included."
call = 'player_results(player_id=79652)'
call_note = "With no top, the whole record in one call: results, 1st, 2nd and 3rd places, medals, top 8s and the best, by mode and in all, with the first and the latest result."
sql = '''
SELECT mode, COUNT(*) AS results, SUM(placement = 1) AS first, SUM(placement = 2) AS second,
       SUM(placement = 3) AS third, SUM(placement <= 3) AS medals, SUM(placement <= 8) AS top8, MIN(placement) AS best
FROM v_results
WHERE player_id = 79652
GROUP BY mode
'''

[[example]]
id = "ex32"
shape = "most_played_pair"
question = "Which two players have played each other the most in 1v1?"
note = "Count the 1v1 sets between each pair once: v_sets_1v1 has one row per set, and MIN and MAX of the two IDs name the pair whichever won. Order by the count, then name both players."
call = 'rank_pairs()'
call_note = "The pairs with the most 1v1 sets between them, each pair once, with each one's wins and every tie included. Never v_head_to_head_1v1 for this: over every player it takes more than a minute."
sql = '''
WITH pairs AS (
  SELECT MIN(winner_id, loser_id) AS player_id, MAX(winner_id, loser_id) AS opponent_id, COUNT(*) AS sets,
         SUM(winner_id < loser_id) AS wins
  FROM v_sets_1v1 GROUP BY 1, 2 ORDER BY sets DESC LIMIT 5)
SELECT pairs.player_id, a.name AS player, pairs.opponent_id, b.name AS opponent, sets, wins, sets - wins AS losses
FROM pairs JOIN players a ON a.player_id = pairs.player_id JOIN players b ON b.player_id = pairs.opponent_id
ORDER BY sets DESC
'''

[[example]]
id = "ex33"
shape = "power_rankings"
question = "Who is ranked first in each region's 2v2 Power Rankings right now?"
note = "Right now by the official ranking: pr_snapshots holds the Power Rankings of one date, per region and mode. Say the date, and that it's the official ranking, not a count of results."
call = 'power_rankings(mode="2v2", top=1)'
call_note = "Each region's top of the official 2v2 Power Rankings, ties included, with the snapshot's date: say it's the ranking of that date."
sql = '''
SELECT region, power_ranking, player_id, points FROM pr_snapshots
WHERE mode = '2v2' AND power_ranking = 1
ORDER BY region
'''

[[example]]
id = "ex34"
shape = "ranking_in_window"
question = "Who has won the most 2v2 medals since the start of 2025?"
note = "A time window, not all time: count medals in SQL from the window's first day, with RANK() so ties stay whole, and say the window in the answer."
call = 'rank_players(by="medals", mode="2v2", since="2025-01-01")'
call_note = "since narrows every template that takes a year to a window, each end included; the scope says it, and so should the answer."
sql = '''
WITH counted AS (
  SELECT player_id, COUNT(*) AS medals FROM v_results
  WHERE mode = '2v2' AND placement <= 3 AND start_date >= '2025-01-01'
  GROUP BY player_id)
SELECT rank, player_id, medals FROM (SELECT *, RANK() OVER (ORDER BY medals DESC) AS rank FROM counted)
WHERE rank <= 5
ORDER BY rank, player_id
'''

[[example]]
id = "ex35"
shape = "upsets"
question = "What was the biggest upset at the Brawlhalla Japan Invitational?"
note = "An upset is a set the lower seed won: the higher initial seed number at that event, from its standings (standings.initial_seed). The biggest has the largest seed difference. Give both seeds, and say a set without both seeds isn't judged."
call = 'upsets(event="brawlhalla japan invitational", top=1)'
call_note = "The sets the lower seed won, the biggest seed difference first, ties whole, with both seeds and the score. With player_id, that player's upset wins; in 2v2, for an event or a player."
sql = '''
WITH seeds AS (
  SELECT s.event_id, p.canonical_id AS player_id, MIN(s.initial_seed) AS seed
  FROM standings s JOIN players p ON p.player_id = s.player_id
  WHERE s.initial_seed IS NOT NULL AND s.event_id = 'tournament/brawlhalla-japan-invitational/event/brawlhalla-championship-1v1'
  GROUP BY 1, 2)
SELECT x.winner_name, w.seed AS winner_seed, x.loser_name, l.seed AS loser_seed, w.seed - l.seed AS seed_difference
FROM v_sets_1v1 x
JOIN seeds w ON w.event_id = x.event_id AND w.player_id = x.winner_id
JOIN seeds l ON l.event_id = x.event_id AND l.player_id = x.loser_id
WHERE x.event_id = 'tournament/brawlhalla-japan-invitational/event/brawlhalla-championship-1v1' AND w.seed > l.seed
ORDER BY seed_difference DESC
LIMIT 1
'''

[[example]]
id = "ex36"
shape = "most_played_teams"
question = "Which two 2v2 teams have played each other the most?"
note = "A 2v2 team is one side of a match: group v_match_results by match_id and side, keep the sides of two players (HAVING COUNT(*) = 2), and name each team by its two player_ids in order. Join each match's two sides on side <> side and keep the lower team first ((x.a, x.b) < (y.a, y.b)), then count the sets between each pair of teams; never pair them by side (side < side), which splits a pairing or drops its meetings. Join players for the four names, and answer with the names the query returns: a player_id isn't a name. rank_pairs ranks 2v2 opponents for one player only, and v_head_to_head_2v2 over every player takes more than 30 s."
sql = '''
WITH sides AS (
  SELECT match_id, side, MIN(player_id) AS a, MAX(player_id) AS b, MAX(won) AS won
  FROM v_match_results
  WHERE mode = '2v2'
  GROUP BY match_id, side
  HAVING COUNT(*) = 2),
meetings AS (
  SELECT x.a AS a1, x.b AS b1, y.a AS a2, y.b AS b2, x.won AS team1_won
  FROM sides x JOIN sides y ON y.match_id = x.match_id AND y.side <> x.side
  WHERE (x.a, x.b) < (y.a, y.b))
SELECT pa.name AS team1_a, pb.name AS team1_b, pc.name AS team2_a, pd.name AS team2_b,
       COUNT(*) AS sets, SUM(team1_won) AS team1_wins, COUNT(*) - SUM(team1_won) AS team2_wins
FROM meetings
JOIN players pa ON pa.player_id = a1 JOIN players pb ON pb.player_id = b1

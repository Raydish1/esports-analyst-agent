# Fly.io: the hosted MCP server and demo page (deploy/README.md). Deploy from the repository's folder:
#   fly deploy
app = "brawlhalla-cortex"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "cortex_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # always on: a cold start loads the players' names for about 20 s, too slow for MCP
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

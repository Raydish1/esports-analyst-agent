<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Card Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800;900&family=Montserrat:wght@500;600;700&display=block">
  <link rel="stylesheet" href="broadcast.css">
  <style>html, body { margin: 0; background: #000; } #out { width: 1920px; height: 1080px; }</style>
</head>
<body>
  <!-- One card's frame at 1920x1080, unscaled, for app/dev/compare_card.py. Needs the server's --preview.
       ?player=ID&mode=1v1 (or 2v2, or nothing for both); &opponent=ID for a head-to-head -->
  <div id="out"></div>
  <script type="module">
    import { fontsReady, headToHeadFrame, lifetimeFrame, setsFrame, teamsFrame } from "./broadcast.js";
    const q = new URLSearchParams(location.search);
    const mode = q.get("mode") || "1v1 and 2v2";
    const id = (name) => encodeURIComponent(q.get(name));
    // Development only: &legend=SLUG (and &opponent_legend=SLUG) draws that legend, to check the art's placement
    // without recording anyone's main. The cards themselves read mains from data/curated/player_legends.csv only.
    const manifest = await (await fetch("art/legends/manifest.json")).json();
    const art = (slug) => {
      const e = slug && manifest.legends[slug];
      return e?.file ? { url: `art/legends/${e.file}`, name: e.name, offset_x: e.offset_x, offset_y: e.offset_y, scale: e.scale } : null;
    };
    await document.fonts.ready;
    if (q.get("team") || q.get("teams")) {  // &team=ID,ID for a partnership; &teams=ID,ID,ID,ID for two teams
      const ids = (q.get("team") || q.get("teams")).split(",").map(encodeURIComponent).join("/");
      const part = q.get("sets") && q.get("teams") ? "?part=1" : "";  // &sets=1: the two teams' set list
      const card = await (await fetch(`/api/preview/${q.get("team") ? "team" : "teams"}/${ids}${part}`)).json();
      document.getElementById("out").append(part ? setsFrame(card).frame : teamsFrame(card, q.get("mode") || "2v2"));
    } else if (q.get("event")) {  // &event=ID: an event's top 8 sets
      const card = await (await fetch(`/api/preview/event/${q.get("event")}`)).json();
      document.getElementById("out").append(setsFrame(card).frame);
    } else if (q.get("sets")) {  // the set list of a head-to-head: &sets=1 with player and opponent
      const card = await (await fetch(`/api/preview/sets/${id("player")}/${id("opponent")}`)).json();
      document.getElementById("out").append(setsFrame(card).frame);
    } else if (q.get("opponent")) {
      const card = await (await fetch(`/api/preview/head_to_head/${id("player")}/${id("opponent")}`)).json();
      if (q.get("legend")) card.players[0].legend = art(q.get("legend"));
      if (q.get("opponent_legend")) card.players[1].legend = art(q.get("opponent_legend"));
      document.getElementById("out").append(headToHeadFrame(card, mode));
    } else {
      const card = await (await fetch(`/api/preview/lifetime/${id("player")}`)).json();
      if (q.get("legend")) card.player.legend = art(q.get("legend"));
      document.getElementById("out").append(lifetimeFrame(card, mode));
    }
    await document.fonts.ready;
    await fontsReady;
    await Promise.all([...document.images].map((im) => im.complete ? null : new Promise((r) => { im.onload = im.onerror = r; })));
    document.body.dataset.ready = "true";
  </script>
</body>
</html>

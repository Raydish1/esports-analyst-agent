<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brawlhalla Cortex</title>
  <meta name="description" content="Ask anything about Brawlhalla tournament history.">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=bespoke-sans@400,500,700,800,900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800;900&family=Montserrat:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="cortex.css">
  <link rel="stylesheet" href="broadcast.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="bar jag" data-jag="torn-bottom" data-seed="7">
      <div class="logo">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 3 40 10v13c0 11-7 18-16 22C15 41 8 34 8 23V10L24 3Z" fill="#0b2a3c" stroke="#19b3c4" stroke-width="2.5"/>
          <path d="M27 11 17 27h7l-3 11 11-17h-7l2-10Z" fill="#f49b0c"/>
        </svg>
        <span>Cortex</span>
      </div>
      <nav class="site-nav" aria-label="Main">
        <a href="#" class="active" aria-current="page">Ask</a>
      </nav>
      <span id="mode" class="mode-badge" hidden></span>
    </div>
  </header>

  <main class="layout">
    <section class="left" aria-label="Chat">
      <h1 class="title">Brawlhalla <em>Cortex</em></h1>
      <p class="tagline">Ask anything about Brawlhalla <b>tournament history</b>.</p>

      <div class="chat-wrap shadow">
        <div class="chat jag" data-jag="card" data-seed="21">
          <div class="messages" id="messages" aria-live="polite">
            <div class="msg bot jag" data-jag="bubble" data-seed="3">Hi! Ask me about players, head-to-heads and official
              events. Results show up <span id="where">on the right</span>.</div>
          </div>
          <div class="suggest" id="suggest"></div>
          <form class="composer" id="composer">
            <label for="q" class="visually-hidden">Your question</label>
            <div class="input jag" data-jag="input" data-seed="11">
              <input id="q" autocomplete="off" maxlength="500" placeholder="How many wins does … have?">
            </div>
            <button class="send jag" data-jag="button" data-seed="5" type="submit">Ask</button>
          </form>
          <div class="chat-foot">
            <button id="restart" class="jag" data-jag="button" data-seed="9" type="button">New conversation</button>
          </div>
        </div>
      </div>
    </section>

    <!-- the divider: a white torn-paper strip between the halves, like the header's edge, under the navy's torn edge -->
    <div class="divider-shadow" aria-hidden="true"><div class="divider jag" data-jag="torn-left" data-seed="58"></div></div>

    <section class="right jag" data-jag="torn-left" data-seed="42" id="right" aria-label="Results">
      <div class="hero" id="hero">
        <canvas id="particles" aria-hidden="true"></canvas>
        <div class="caption" id="heroName"></div>
      </div>
    </section>
  </main>
</body>
</html>

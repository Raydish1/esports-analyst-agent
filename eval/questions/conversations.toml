# Multi-turn test conversations: what the user typed in the web app's live mode, cut into conversations, with expected
# facts computed from the frozen snapshot eval-v1. c1-c7 (v1) come from 2026-11-19 (data/experiments/web/
# 20261119T233544Z-002 and -003), all verified by the user that day. c8-c13 (v2, 2026-11-20) come from the second and
# third rounds of live tests (20261120T050251Z-001, -003, -004 and -005; docs/web-app-testing-notes.md on
# claude/web-app, findings 7-20). c14-c17 (v3, 2026-11-20) come from the fourth round (20261120T175430Z-001,
# 20261120T175642Z-001 to -003; findings 21-29), and c18-c19 (2026-11-21) from the fifth (20261121T045117Z-002,
# 20261121T053752Z-002; findings 30-35), not verified yet. Review them in conversations-review.md, which `python eval/conversations.py review`
# makes from this file with each query's result; edit this file, never the page. Played and scored by
# eval/conversations.py.
#
# A set in the same format with `heldout = true` at the top is played and reported without its text: only its ids,
# turn numbers and checks.
#
# Each conversation has:
#   id        c1, c2, ...: stable, never reused.
#   title     what it is, in a few words.
#   source    the transcript and turns it comes from.
#   measures  what it tests: the fix it targets, or "control" for one that went right and must stay right.
#   verified  filled in by the person verifying: "" until checked, then "yes" (or "yes: ..."), or "no: ..." /
#             "partly: ..." with what's right.
#   turn      the user's messages, in order, each with:
#     say       the message, as the user typed it.
#     expect    what a right answer says, written from the queries' results: for the hand verdict.
#     query     the SQL behind expect, each with its purpose.
#     shown     optional: the line the page adds to the turn's history about the cards it showed after the answer,
#               as the web app would write it (finding 9), given to the agent once it takes one.
#     checks, each optional, read on the turn's window: this turn's tool results and the previous turn's, which is
#     what the model has in front of it (react.Conversation keeps older turns as question and answer only):
#       rows         each pattern is held by a row of the window's results. Values match as stage 2 matches them:
#                    numbers to two decimals, text equal to a cell or inside it (four characters or more). A list in
#                    a pattern is alternatives, such as [142100, "megD"]. A player_id counts as its name once a tool
#                    returned the name.
#       rows_any     one of the patterns is.
#       window_has   each text is in the window's tool results (a note, say).
#       check        an evaluation set question's stage 2 check passes on the window's results ("q38").
#       calls        the turn calls each of these tools.
#       not_calls    it calls none of these.
#       calls_with   a call that ran matches one of these: [{tool = "rank_players", mode = "1v1", since = "*"}, ...],
#                    each argument as written (any case), "*" for any value given, "-" for one left out.
#       players      the turn's queries and template calls that ran use each of these player_ids.
#       not_players  they use none of these.
#       not_looked_up  no resolve_player or resolve_event call, the loop's own lookups included, is given a name holding
#                    one of these words ("two", "say").
#       suggests     the turn ends in suggestions, this player first.
#       says         the answer has each of these texts (any case).
#       says_any     the answer has one of them.
#       not_says     the answer has none of them.
#       says_numbers the answer states each of these numbers.
#       says_record  {record = [a, b], about = [...]}: one sentence or list item of the answer has one of the about
#                    words and states the record: "a-b" (or with a dash), or a and b with a word for winning or
#                    losing ("won 2 sets, lost 3", "2 wins, 3 losses").
#       unconfirmed_at_most  the number check replaced at most this many of the answer's claims (the trace's
#                    unconfirmed): 0 where every fact the answer needs is one call away.
#       grounded     on unless false: every number the answer states, and every player_id it cites, is in the
#                    window or its questions, by the number check's rules (agent/number_check.py).
#       named        on unless false: no player is named only by ID ("Player 147569").


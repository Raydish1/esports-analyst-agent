# Which worked-example shapes (agent/examples/examples.toml) would help answer each evaluation question: the relevance
# labels for measuring retrieval alone (python agent/retrieval.py measure). Labelled by hand on 2026-10-25, from each
# question's category and the query its verified answer needed; not reviewed by the user.
#
# A question with no shapes has no example that helps, since no query answers it: prize money per tournament (q09,
# q32), career earnings (q33, which the views don't hold), results before 2017 (q34), legends (q35) and community
# events (q36). For those, the measurement counts how many examples are retrieved anyway.
#
# q20 also has event_final since 2026-11-10, when that shape's example (ex29, on v_sets_1v1) was added to the bank.

[shapes]
q01 = ["last_event"]
q02 = ["official_wins"]

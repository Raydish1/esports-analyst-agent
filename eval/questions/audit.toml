# The question audit's set (2026-11-20; docs/question-audit.md, docs/agent-mechanisms.md): the kinds of questions a
# Brawlhalla fan asks, each in at least two phrasings, to check the failure mechanisms on questions the agent wasn't
# tuned on. It isn't for scoring, and nothing in it is verified: `expect` says what a right answer does, not a checked
# fact, and the checks look at how the turn went (its tools, its scope, its claims), not at the answer's facts.
#
# The format is conversations.toml's (its header documents the checks), played and scored by eval/conversations.py
# with --set, and reported by eval/audit.py, which groups the failed checks by kind and mechanism. Each conversation
# also has:
#   kind       the kind's number in docs/question-audit.md.
#   mechanism  what it probes: M1 reading the question, M2 the tools, M3 facts the model makes, M4 the conversation.

snapshot = "data/db/eval/eval-v1.sqlite"

[[conversation]]
id = "a01"
title = "A player's stats"
kind = 1
mechanism = ["M2", "M3"]
[[conversation.turn]]
say = "zivai stats"
expect = "Zivai's whole record in one call: player_results with no top, every count by mode from the tool."
calls_with = [{ tool = "player_results", player_id = 147982, top = "-" }]


[[question]]
id = "q11"
question = "What is Raydish's most dominant tournament win?"
category = "multi_step"
tests = ["target question 11", "ranking", "name the metric", "crew battles left out of dominance"]
players = { Raydish = 160000 }
answer = """
By games lost across the run (fewest first, then fewest sets dropped, then most games won): the Trial of Laufey - \
North America (Moose Wars) (2024-08-25), where Raydish won all 9 sets, 25 games to 2: two 2-0s, then 3-0, 3-1, \
3-0, 3-0, 3-0 (Bunny meow), 3-0 and 3-1 (both against BBBalloonBoy).

The other wins: Trial of Heimdall (10 sets, 27-7 in games), NA Winter Championship 2023 (10 sets, 25-7), Trial of \
Ymir (10 sets, 27-8), NA Summer Championship 2022 (15 sets, one dropped, 37-9). The 2026 NA Crew Battle Championship \
win is left out: its sets are crew against crew, so not comparable.
"""
verified = ""

[[question.query]]
purpose = "official wins ranked by dominance, crew battles left out"
sql = '''
SELECT tournament_name, start_date, sets_played, sets_dropped, games_won, games_lost, unscored_sets, no_contests
FROM v_win_runs
WHERE player_id = 160000 AND is_crew_battle = 0 AND sets_played > 0
ORDER BY unscored_sets > 0, games_lost, sets_dropped, games_won DESC
'''

[[question.query]]
purpose = "the top run's sets"
sql = '''
SELECT m.start_time, p.name AS opponent, m.games_won, m.games_lost
FROM v_match_results m
JOIN v_match_results o ON o.match_id = m.match_id AND o.side <> m.side
JOIN players p ON p.player_id = o.player_id
WHERE m.player_id = 160000
  AND m.competition_key = 'tournament/trial-of-laufey-north-america-moose-wars/event/brawlhalla-1v1'
ORDER BY m.start_time
'''

[[question.query]]
purpose = "crew battle wins, left out"
sql = '''
SELECT tournament_name, start_date FROM v_win_runs WHERE player_id = 160000 AND is_crew_battle = 1
'''


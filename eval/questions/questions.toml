# The evaluation set, v1: questions a user would ask, with candidate answers computed from the frozen snapshot
# eval-v1. Review them in review.md, which `python eval/review_questions.py` makes from this file with each query's
# result; edit this file, never review.md.
#
# Each question has:
#   id              q01, q02, ...: stable, never reused.
#   question        as a user would type it.
#   category        player_record  one player's results (wins, medals, top 8s, last event, partners)
#                   event_result   one event's results (winner, top 8, bracket link)
#                   head_to_head   records between players
#                   multi_step     comparisons, firsts, mosts and rankings: several steps, or an aggregate
#                   unanswerable   the data can't answer it, or only partly: the expected answer says what isn't
#                                  available, and why
#   tests           what the question exercises: its source (target question N, known event), how a name is
#                   written (nickname, former name, case, misspelling, team tag, shared name), event aliases and
#                   terms, paraphrases, and the counting rules involved.
#   players         each name in the question and the player (canonical ID) it means.
#   events          each event name in the question and the event IDs it means.
#   same_answer_as  for a paraphrase: the question it must answer the same way.
#   answer          the candidate answer, written from the queries' results, as the agent should give it (the
#                   answer rules in docs/schema-proposal.md §8: say "official events", name the player and the
#                   metric, missing isn't zero).
#   notes           what a verifier should know: acceptable variants, caveats, things worth checking.
#   query           the SQL behind the answer, one or more queries, each with its purpose. Players are looked up
#                   first and queried by ID, as the agent will (the head-to-head views are slow otherwise).
#   verified        filled in by the person verifying: "" until checked, then "yes", or "no: ..." / "partly: ..."
#                   with what's right.

snapshot = "data/db/eval/eval-v1.sqlite"
build = "20261007T230135Z"

# Target questions (docs/schema-proposal.md §8)

[[question]]
id = "q01"
question = "What was the last tournament Boomie entered?"
category = "player_record"
tests = ["target question 1", "shared name", "last event entered"]
players = { Boomie = 146606 }
answer = """
Boomie last entered an official event on 2024-03-10: the Winter Doubles Championship - North America (2v2), \
placing 2nd. Boomie's last 1v1 event was the Brawlhalla World Championship Expo 2023 (BCX 2023, 2023-11-03), 49th.
"""
notes = """
The newest event is 2v2, not a side format, so the newest 1v1 event is extra: answer rule 2 asks for it only after a \
side format.
"""
verified = ""

[[question.query]]
purpose = "the newest official event entered, side formats included"
sql = '''
SELECT start_date, tournament_name, event_name, mode, format, placement
FROM v_entries WHERE player_id = 146606
ORDER BY start_time DESC LIMIT 1
'''

[[question.query]]
purpose = "the newest 1v1 event"
sql = '''
SELECT start_date, tournament_name, event_name, mode, placement
FROM v_entries WHERE player_id = 146606 AND mode = '1v1'
ORDER BY start_time DESC LIMIT 1
'''


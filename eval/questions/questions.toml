[[question]]
id = "q08"
question = "Who has the best record against marckiemoo?"
category = "head_to_head"
tests = ["target question 8", "nickname", "name the metric", "ranking", "no-contests left out"]
players = { marckiemoo = 146052 }
answer = """
By 1v1 set win rate against Marckiem00 at official events, among players with at least 5 sets against them (DQs \
and forfeits left out):
1. V3M_T4NQUIL0: 3-2 (60%)
2. Raydish: 6-7 (46%)
3. gdsandstorm: 4-7 (36%)

V3M_T4NQUIL0 is the only one of them with a winning record.
"""
notes = """
The minimum decides the answer, so the answer must state it. With at least 4 sets, Ahmet_ (3-1, 75%) leads; with at \
least 3, Ahmet_ and then Dragon! (2-1). An answer with another stated minimum is right if its ranking is right for \
that minimum. BBBalloonBoy has played Marckiem00 the most (4-13).
"""
verified = ""

[[question.query]]
purpose = "records against Marckiem00, at least 5 sets, best win rate first"
sql = '''
SELECT p.name, h.player_id, h.wins, h.losses, h.matches,
       ROUND(100.0 * h.wins / h.matches, 1) AS win_pct
FROM v_head_to_head_1v1 h JOIN players p ON p.player_id = h.player_id
WHERE h.opponent_id = 146052 AND h.matches >= 5
ORDER BY 1.0 * h.wins / h.matches DESC, h.matches DESC LIMIT 5
'''

[[question.query]]
purpose = "the same with at least 3 sets, to show how the minimum matters"
sql = '''
SELECT p.name, h.wins, h.losses, h.matches
FROM v_head_to_head_1v1 h JOIN players p ON p.player_id = h.player_id
WHERE h.opponent_id = 146052 AND h.matches >= 3
ORDER BY 1.0 * h.wins / h.matches DESC, h.matches DESC LIMIT 3
'''


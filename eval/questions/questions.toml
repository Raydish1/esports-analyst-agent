answer = """
3 times, all in 1v1 at official events, each won by Zivai (formerly Godly) with Ahmet_ 2nd: the Spring (2026-04-25), \
Summer (2026-07-18) and Autumn (2026-09-19) Championships - Europe 2026.
"""
notes = """
"Ahmet" also names a record with one result; Ahmet_ is the ranked player.
"""
verified = ""

[[question.query]]
purpose = "2026 events Zivai won with Ahmet_ 2nd"
sql = '''
SELECT a.start_date, a.tournament_name, a.mode
FROM v_results a
JOIN v_results b ON b.event_id = a.event_id AND b.player_id = 75405 AND b.placement = 2
WHERE a.player_id = 147982 AND a.placement = 1 AND a.start_date LIKE '2026-%'
ORDER BY a.start_time
'''


[[question]]
id = "h13"
question = "what was Santy's set record at the 2021 Pro Series finals?"
category = "partial"
tests = ["held-out", "no match data", "crew battle", "shared name"]
players = { santy = 147613 }
events = { "2021 Pro Series finals" = "series/pro-series-2021-na" }
answer = """
The data has no sets for the Pro Series finals, only placements, so his set record there isn't available. Santy's \
crew won the Pro Series 2021 finals (1st), with gdsandstorm, DEZZ, Snowy!!, S!mba and Zinquer.
"""
notes = """
No platform has the Pro Series finals: their placements come from the Stats API, which has no matches \
(check_exceptions.csv). Three players are called Santy; this one has 101 official results.
"""
verified = true

[[question.query]]
purpose = "his placement, his crew, and the matches stored for the event"
sql = '''
SELECT r.placement, (SELECT GROUP_CONCAT(p.name, ', ') FROM v_results x JOIN players p ON p.player_id = x.player_id
                     WHERE x.event_id = r.event_id AND x.placement = r.placement) AS crew,
       (SELECT COUNT(*) FROM matches WHERE event_id = r.event_id) AS matches
FROM v_results r WHERE r.player_id = 147613 AND r.event_id = 'series/pro-series-2021-na'
'''

[[question]]
id = "h14"
question = "what country is Fozey from?"
category = "unanswerable"
tests = ["held-out", "data not available", "an empty column"]
players = { fozey = 118096 }
answer = """
The data doesn't say: no player's country is recorded (the players table has a country column, but it's empty for \
every player).
"""
notes = "The prompt doesn't describe players.country; an agent that finds it must still read its emptiness as missing, not as an answer."
verified = true

[[question.query]]
purpose = "countries recorded"
sql = '''
SELECT COUNT(*) AS players, SUM(country IS NOT NULL AND country <> '') AS with_country FROM players
'''

[[question]]
id = "h15"
question = "who has the most official top 8s without ever winning an official event?"
category = "multi_step"
tests = ["held-out", "never", "anti-join", "state the assumption"]
answer = """
sphynx., with 36 top 8s at official events across 1v1 and 2v2 and no official win. Next come Goddess (33) and \
hermisen (32).
"""
verified = true

[[question.accept]]
assumption = "top 8s and wins in both modes (the default)"
answer = "sphynx., 36"

[[question.accept]]
assumption = "1v1 only: the most 1v1 top 8s without a 1v1 win"
answer = "Phazon, 28 (he has official 2v2 wins)"

[[question.query]]
purpose = "top 8s of players with no official win, both modes"
sql = '''
SELECT p.name, COUNT(*) AS top8s FROM v_results r JOIN players p ON p.player_id = r.player_id
WHERE r.placement <= 8 AND r.player_id NOT IN (SELECT player_id FROM v_official_wins)
GROUP BY r.player_id ORDER BY top8s DESC LIMIT 5
'''

[[question.query]]
purpose = "1v1 only"
sql = '''
SELECT p.name, COUNT(*) AS top8s FROM v_results r JOIN players p ON p.player_id = r.player_id
WHERE r.placement <= 8 AND r.mode = '1v1'
  AND r.player_id NOT IN (SELECT player_id FROM v_official_wins WHERE mode = '1v1')
GROUP BY r.player_id ORDER BY top8s DESC LIMIT 5
'''

[[question]]
id = "h16"
question = "has Piggers ever won a 1v1 event?"
category = "player_record"
tests = ["held-out", "true none", "an empty result that is right"]
players = { piggers = 143695 }
answer = """
No: Piggers has no official 1v1 win. His best official 1v1 finish is 2nd (in 27 1v1 results). All 11 of his \
official wins are in 2v2.
"""
notes = "An empty result here is the right answer: the agent shouldn't relax the mode or call it a lookup mistake."
verified = true

[[question.query]]
purpose = "1v1 wins, best 1v1 finish, 2v2 wins"
sql = '''
SELECT (SELECT COUNT(*) FROM v_official_wins WHERE player_id = 143695 AND mode = '1v1') AS wins_1v1,
       (SELECT MIN(placement) FROM v_results WHERE player_id = 143695 AND mode = '1v1') AS best_1v1,
       (SELECT COUNT(*) FROM v_results WHERE player_id = 143695 AND mode = '1v1') AS results_1v1,
       (SELECT COUNT(*) FROM v_official_wins WHERE player_id = 143695 AND mode = '2v2') AS wins_2v2
'''
